<div class="create-account-container">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Create a New Account</mat-card-title>
        <mat-card-subtitle>... so you can find roomies!</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="createAccountForm" (ngSubmit)="onSubmit()">
          <div class="name-fields">
            <mat-form-field appearance="fill" class="name-field">
              <mat-label>First Name</mat-label>
              <input matInput formControlName="firstName" />
            </mat-form-field>
            <mat-form-field appearance="fill" class="name-field">
              <mat-label>Last Name</mat-label>
              <input matInput formControlName="lastName" />
            </mat-form-field>
          </div>
          <mat-form-field appearance="fill">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" />
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>New Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
            <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>Date of Birth</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="birthDate" />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
          <mat-card-actions>
            <button mat-raised-button color="primary" type="submit" [disabled]="createAccountForm.invalid">
              Sign Up
            </button>
          </mat-card-actions>
        </form>
        <mat-error *ngIf="createAccountForm.get('firstName')?.invalid && createAccountForm.get('firstName')?.touched">
            Please enter your first name.
        </mat-error>
        <mat-error *ngIf="createAccountForm.get('lastName')?.invalid && createAccountForm.get('lastName')?.touched">
            Please enter your last name.
        </mat-error>
        <mat-error *ngIf="createAccountForm.get('email')?.invalid && createAccountForm.get('email')?.touched">
            Please enter a valid email.
        </mat-error>
        <mat-error *ngIf="createAccountForm.get('password')?.invalid && createAccountForm.get('password')?.touched">
            Password is required.
        </mat-error>
        <mat-error *ngIf="createAccountForm.get('birthDate')?.invalid && createAccountForm.get('birthDate')?.touched">
            Please enter a valid date of birth.
        </mat-error>
      </mat-card-content>
    </mat-card>
  </div>
